[project]
name = "seattletransit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "milescb", email = "mcochranbranson@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gtfs-realtime-bindings>=3.0.0",
    "requests>=2.34.2",
]

[project.scripts]
seattletransit = "seattletransit:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
notebook = [
    "contextily>=1.7.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]
