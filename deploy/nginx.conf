# Copy to /etc/nginx/conf.d/seattlelink.milescb.com.conf
#
# The Cloudflare tunnel's public hostname forwards to http://localhost:80 with
# Host: seattlelink.milescb.com, so nginx routes by server_name and no TLS is
# needed here (Cloudflare terminates it at the edge -- no certbot, no 443 block).
#
# Plain `listen 80`: never add default_server, or this block steals the unmatched
# requests of every other site on the box (sites-enabled/default owns that).
server {
    listen 80;
    listen [::]:80;
    server_name seattlelink.milescb.com;

    access_log /var/log/nginx/seattlelink.access.log;
    error_log  /var/log/nginx/seattlelink.error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Flask serves the static frontend and the JSON API itself (static_url_path=""),
    # so unlike PiWebsite there is no `root` + `/api/` split -- one proxy covers all.
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }
}
